# Χτίζει το πρόγραμμα για Windows και ανεβάζει την έκδοση του package.json στα Releases
# (installer, blockmap και latest.yml, από όπου τη βρίσκουν τα εγκατεστημένα προγράμματα).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: node build-app.js
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Ανέβασμα στα Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --target "$GITHUB_SHA" --title "Αγρολόγιο $V" --notes "Δείτε τις αλλαγές στο README."
          gh release upload "v$V" "dist/Agrologio-Setup-$V.exe" "dist/Agrologio-Setup-$V.exe.blockmap" dist/latest.yml --clobber
