# Κάθε εβδομάδα ελέγχει για νέες εκδόσεις και τις προτείνει ως pull request (καμία δεν μπαίνει μόνη της).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
